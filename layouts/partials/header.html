<header class="site-header shell">
  <a class="brand" href="{{ site.Home.RelPermalink }}" aria-label="返回思绪花园首页">
    <span class="brand-mark" aria-hidden="true">芽</span><span>{{ site.Title }}</span>
  </a>
  <nav class="site-nav" aria-label="主要导航">
    <a href="{{ site.Home.RelPermalink }}"{{ if .IsHome }} aria-current="page"{{ end }}>首页</a>
    <a href="{{ "posts/" | relURL }}"{{ if eq .Section "posts" }} aria-current="page"{{ end }}>文章</a>
    <a href="{{ "tags/" | relURL }}"{{ if hasPrefix .RelPermalink ("tags/" | relURL) }} aria-current="page"{{ end }}>标签</a>
    <a href="{{ "archives/" | relURL }}"{{ if eq .Section "archives" }} aria-current="page"{{ end }}>归档</a>
    <a href="{{ "about/" | relURL }}"{{ if eq .RelPermalink ("about/" | relURL) }} aria-current="page"{{ end }}>关于</a>
  </nav>
  <button class="theme-toggle" type="button" data-theme-toggle aria-label="切换深色模式" title="切换明暗主题">
    <span class="theme-icon" aria-hidden="true">◐</span>
  </button>
</header>
