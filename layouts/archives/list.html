{{ define "main" }}
<div class="shell page-shell">
  <header class="page-header"><p class="eyebrow">Timeline</p><h1>{{ .Title }}</h1><p>{{ .Description }}</p></header>
  <div class="archive-list">
    {{ range (where site.RegularPages "Section" "posts").GroupByDate "2006" }}
      <section><h2>{{ .Key }}</h2><ol>{{ range .Pages }}<li><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "01 月 02 日" }}</time><a href="{{ .RelPermalink }}">{{ .Title }}</a></li>{{ end }}</ol></section>
    {{ end }}
  </div>
</div>
{{ end }}
